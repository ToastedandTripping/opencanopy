[build]
  command = "npm run build"
  publish = "out"
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "22"

# Edge function routing
[[edge_functions]]
  path = "/api/wfs"
  function = "wfs-proxy"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Report-only CSP (P1b). Observes only — never blocks a request — so this
    # is safe to ship while we watch for violations before ever flipping to
    # enforce (a separate, future step; NOT this batch).
    #
    # 'unsafe-inline' on script-src: this is a static export (output:"export")
    # serving Next.js's RSC hydration scripts, which are NOT nonced in a
    # static build (nonces require a server to mint a per-request value).
    # Tailwind's arbitrary-value utilities also compile to inline `style=`
    # attributes throughout the app, so style-src needs 'unsafe-inline' too.
    # Do NOT "tighten" either of these without switching to a build that can
    # emit nonces/hashes, or every RSC-hydrated page (i.e. the whole site)
    # goes blank.
    #
    # blob: on worker-src/child-src: maplibre-gl spins up its render worker
    # from a blob: URL (its bundled worker script, not a same-origin file).
    # Removing this blanks the map — MapLibre silently fails to construct
    # its worker pool.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://ssc-ops.netlify.app; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://pub-b5568be386ef4e638b4e49af41395600.r2.dev https://api.maptiler.com; connect-src 'self' https://api.maptiler.com https://pub-b5568be386ef4e638b4e49af41395600.r2.dev https://ssc-ops.netlify.app; font-src 'self'; worker-src 'self' blob:; child-src blob:; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"

# Cache static assets (fingerprinted by Next.js)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache data directory
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# PMTiles: long cache + CORS for cross-origin range requests
[[headers]]
  for = "/data/tiles/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Access-Control-Allow-Origin = "*"
