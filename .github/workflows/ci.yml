name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # P1c: both gates confirmed green locally before this flip (24 tooling
      # lint errors resolved via eslint.config.mjs scoped override, 3 hooks
      # errors resolved via lazy-init/scoped-disable, 2 fixable audit
      # moderates cleared via `npm audit fix`). No more silently-red gates.
      - name: Audit (high severity)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint
