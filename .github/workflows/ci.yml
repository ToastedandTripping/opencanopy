name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # A new advisory turns CI red without waiting for a push. GitHub disables
  # schedules after 60 days without repository activity.
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The logged-hectares fixture test runs scripts/build-scrub-tables.py through
      # python3; under CI it fails, never skips, when these are missing.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python geometry libraries
        run: python3 -m pip install shapely==2.1.2 pyproj==3.7.2

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Lint sits above the audit steps so a red audit can never hide it.
      - name: Lint
        run: npm run lint

      # Anything non-dev in the lock, at high: this code reaches the browser.
      - name: Audit (runtime, high)
        run: npm audit --omit=dev --audit-level=high

      # The whole tree, at critical: Netlify installs the dev chain and runs our
      # build with it, so this bounds what the warning below lets through.
      - name: Audit (full tree, critical)
        run: npm audit --audit-level=critical

      # A dev-chain high warns without blocking. Do not rewrite this with jq or
      # $(...): those forms go permanently red on the moderates. A registry
      # failure also lands here and warns, which errs loud.
      - name: Audit (dev chain, high, warning only)
        run: npm audit --audit-level=high || echo "::warning title=Dev-chain high::run npm audit"
